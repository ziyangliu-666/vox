name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag, e.g. v0.3.4 (empty: build only)"
        required: false
        default: ""

jobs:
  macos:
    # actool compiles the macOS 26 .icon only on a macOS 26 host; on
    # macos-15 with Xcode 26.3 its asset agent crashes.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The newest Xcode on the image: compiling the .icon needs Xcode 26.
      - name: Select Xcode
        run: |
          xc=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version
      # The self-signed "vox Code Signing" certificate, so every release has
      # the same designated requirement and macOS keeps its permissions.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/vox.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/vox.p12"
          security import "$RUNNER_TEMP/vox.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/vox.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -p codesigning "$kc" | awk '/"vox Code Signing"/ {print $2; exit}')
          echo "VOX_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - run: packaging/build_mac.sh
        env:
          VOX_REQUIRE_ICON: "1"
          VOX_REQUIRE_SIGN: "1"
      - name: Put the version in the file name
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          mv dist/vox.dmg "dist/vox-$v.dmg"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: vox-${{ env.VERSION }}-macos
          path: dist/vox-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/build_win.ps1
        shell: pwsh
      - name: Put the version in the file name
        shell: bash
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          mv dist/vox.exe "dist/vox-$v.exe"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: vox-${{ env.VERSION }}-windows
          path: dist/vox-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        # A manual run creates the tag on the commit it built.
        run: >
          gh release create "$TAG" vox-*.dmg vox-*.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "vox $TAG" --generate-notes

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag, e.g. v0.3.4 (empty: build only)"
        required: false
        default: ""

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The newest Xcode on the image: compiling the .icon needs Xcode 26.
      - name: Select Xcode
        run: |
          xc=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version
      - run: packaging/build_mac.sh
        env:
          VOX_REQUIRE_ICON: "1"
      - name: Put the version in the file name
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          mv dist/vox.dmg "dist/vox-$v.dmg"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: vox-${{ env.VERSION }}-macos
          path: dist/vox-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/build_win.ps1
        shell: pwsh
      - name: Put the version in the file name
        shell: bash
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          mv dist/vox.exe "dist/vox-$v.exe"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: vox-${{ env.VERSION }}-windows
          path: dist/vox-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        # A manual run creates the tag on the commit it built.
        run: >
          gh release create "$TAG" vox-*.dmg vox-*.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "vox $TAG" --generate-notes

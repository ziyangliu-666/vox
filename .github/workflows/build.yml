name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vox-macos
          path: dist/vox.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/build_win.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: vox-windows
          path: dist/vox.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" vox.dmg vox.exe
          --repo "$GITHUB_REPOSITORY" --title "vox $GITHUB_REF_NAME" --generate-notes

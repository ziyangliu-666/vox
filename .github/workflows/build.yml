name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag, e.g. v0.3.4 (empty: build only)"
        required: false
        default: ""

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vox-macos
          path: dist/vox.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/build_win.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: vox-windows
          path: dist/vox.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        # A manual run creates the tag on the commit it built.
        run: >
          gh release create "$TAG" vox.dmg vox.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "vox $TAG" --generate-notes

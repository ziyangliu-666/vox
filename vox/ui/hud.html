<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vox HUD</title>
<link rel="stylesheet" href="style.css">
<style>
  /* The HUD window must stay see-through. Only mock mode paints a backdrop. */
  html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; }

  /* The capsule is dark in light and dark mode, so the white content keeps
     high contrast over any app behind it. These tokens do not follow the
     colour scheme on purpose. */
  :root {
    --hud-bg: rgba(22, 22, 25, 0.94);
    --hud-idle: rgba(28, 28, 32, 0.72);
    --hud-edge: rgba(255, 255, 255, 0.14);
    --hud-fg: #ffffff;
    --hud-fg-2: rgba(255, 255, 255, 0.66);
    --hud-fg-3: rgba(255, 255, 255, 0.45);
    --hud-chip: rgba(255, 255, 255, 0.14);
    --hud-ok: #34d17a;
    --hud-warn: #ffb547;
    --hud-morph: 150ms cubic-bezier(0.3, 0.8, 0.2, 1);
  }

  /* Stage = the HUD window (300 x 72 by default). The pill sits on its
     bottom edge with room above and at the sides for the shadow. */
  .stage { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 0 14px; pointer-events: none; }
  /* The pill lies flat against the screen edge it is docked to; Python
     picks the edge with hud.dock() and moves the window there. */
  .stage[data-dock="top"] { align-items: flex-start; padding: 14px 0 0; }
  .stage[data-dock="left"] { align-items: center; justify-content: flex-start; padding: 0 0 0 14px; }
  .stage[data-dock="right"] { align-items: center; justify-content: flex-end; padding: 0 14px 0 0; }

  .pill {
    position: relative;
    height: 32px;
    width: 46px;
    border-radius: 999px;
    background: var(--hud-bg);
    box-shadow: 0 0 0 1px var(--hud-edge), 0 8px 24px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.18);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
    color: var(--hud-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: width var(--hud-morph), height var(--hud-morph), background var(--hud-morph), opacity 120ms ease, transform var(--hud-morph);
  }

  /* Idle: a small mark that vox runs. The light edge keeps it visible on
     dark wallpapers; the low fill keeps it quiet on light ones. */
  .pill[data-phase="idle"] { height: 10px; background: var(--hud-idle); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.38), 0 2px 6px rgba(0, 0, 0, 0.22); opacity: 0.9; }
  .pill[data-phase="hidden"] { height: 10px; opacity: 0; transform: scale(0.8); }
  /* Hover says "you can grab this"; drag lifts the pill off the screen. */
  .pill.hover { transform: scale(1.06); }
  .pill.hover[data-phase="idle"] { width: 60px !important; height: 14px; opacity: 1; }
  /* On a side edge the pill stands upright while it has no text: a thin
     strip at rest, a column of level bars while listening. Text never
     turns sideways; for "done" and "error" the pill lies flat again and
     slides out from the edge. */
  .pill.v { width: 32px !important; height: 84px; }
  .pill.v[data-phase="idle"], .pill.v[data-phase="hidden"] { width: 10px !important; height: 46px; }
  .pill.v.hover[data-phase="idle"] { width: 14px !important; height: 60px; }
  .pill.v[data-phase="cancelled"] { height: 32px; }
  .pill.v .content { flex-direction: column; padding: 12px 0; }
  .pill.v .bars { flex-direction: column; height: auto; width: 20px; }
  .pill.v .bars i { height: 3px; }
  .pill.v #hint { display: none !important; }
  /* Upright and locked: the lock sits above the bars, so the pill grows. */
  .pill.v.locked[data-phase="listening"] { height: 104px; }
  /* ---------- free mode (macOS) ----------
     The window covers the whole screen and lets clicks through; the pill
     sits at an anchor point on the edge it is docked to. The anchor's
     transform puts the pill's flat side on that point, so a pill that
     grows stays against its edge. Moves run on a spring curve. */
  .anchor { display: contents; }
  .stage.free { display: block; padding: 0; }
  /* Only left/top place the anchor: with top and bottom both set, its
     height would be 0, and translate(-50%, -100%) would not lift the pill. */
  .stage.free .anchor { display: block; position: absolute; }
  /* Windows: the pill is grabbed in the small-window layout too. */
  .stage:not(.free) .pill { pointer-events: auto; cursor: grab; }
  /* .stage ignores the pointer, and the pill would inherit that. */
  .stage.free .pill { pointer-events: auto; cursor: grab; }
  .stage.free .pill.dragging { cursor: grabbing; }
  .anchor[data-edge="bottom"] { transform: translate(-50%, -100%); }
  .anchor[data-edge="top"] { transform: translate(-50%, 0); }
  .anchor[data-edge="left"] { transform: translate(0, -50%); }
  .anchor[data-edge="right"] { transform: translate(-100%, -50%); }
  .anchor[data-edge="drag"] { transform: translate(-50%, -50%); }
  .anchor.fly { transition: left 420ms var(--spring), top 420ms var(--spring), transform 420ms var(--spring); }
  :root { --spring: cubic-bezier(0.34, 1.32, 0.64, 1); --brand: #ff7a59; }
  /* Size eases out without overshoot; only the position springs. A
     springing size wobbles, and the wobble reads as a jump. */
  .stage.free .pill { transition: width 220ms var(--ease-out-soft), height 220ms var(--ease-out-soft), background var(--hud-morph), opacity 120ms ease, transform 160ms var(--ease-out-soft); }
  :root { --ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1); }

  /* Guides: shown only while dragging. Rails on the four edges, a dot on
     each magnet, and for the target: a bright rail, a ring on the magnet,
     an alignment line into the screen, and a ghost of where the pill lands. */
  .guides { position: absolute; inset: 0; opacity: 0; transition: opacity 160ms ease; pointer-events: none; }
  .guides.on { opacity: 1; }
  .guides i { position: absolute; display: block; }
  .rail { background: rgba(255, 122, 89, 0.28); border-radius: 2px; transition: background 120ms ease; }
  .rail.on { background: var(--brand); box-shadow: 0 0 10px rgba(255, 122, 89, 0.55); }
  .tick { width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--brand), 0 1px 4px rgba(0, 0, 0, 0.35); transition: transform 140ms var(--spring); }
  .tick.on { transform: scale(1.7); }
  .line { opacity: 0; transition: opacity 120ms ease; }
  .line.on { opacity: 1; }
  .line.h { height: 0; border-top: 2px dashed var(--brand); }
  .line.v { width: 0; border-left: 2px dashed var(--brand); }
  .ghost { border-radius: 999px; border: 2px dashed rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(0, 0, 0, 0.35); background: rgba(255, 122, 89, 0.18); transition: left 140ms var(--spring), top 140ms var(--spring), width 140ms ease, height 140ms ease; }

  .pill.dragging { transform: scale(1.1); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5), 0 14px 32px rgba(0, 0, 0, 0.35); opacity: 1; }
  .pill[data-phase="idle"] .content, .pill[data-phase="hidden"] .content { opacity: 0; transition: opacity 60ms ease; }

  .content {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 500;
    opacity: 1;
    transition: opacity 120ms ease 60ms;
  }
  .content > [hidden] { display: none !important; }
  .content.swap { animation: swap 140ms ease; }
  @keyframes swap { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

  /* Live level: white bars, centre-weighted, driven by hud.level(). */
  .bars { display: flex; align-items: center; gap: 2px; height: 20px; }
  .bars i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--hud-fg); }
  .pill[data-phase="transcribing"] .bars i { opacity: 0.8; }
  /* Toggle mode needs room for its hint: drop two bars at each end. */
  .pill.toggle .bars i:nth-child(-n+2), .pill.toggle .bars i:nth-last-child(-n+2) { display: none; }
  /* Locked adds a lock icon: drop one more bar at each end and tighten gaps,
     so the hint still fits in a 300 px window. */
  .pill.locked:not(.v) .bars i:nth-child(-n+3), .pill.locked:not(.v) .bars i:nth-last-child(-n+3) { display: none; }
  .pill.locked:not(.v) .content { gap: 6px; }
  .pill.locked:not(.v) .hint { gap: 3px; }

  .hint { font-size: 12px; color: var(--hud-fg-2); display: inline-flex; align-items: center; gap: 4px; }
  .chip { padding: 1px 5px; border-radius: 4px; background: var(--hud-chip); color: var(--hud-fg); font-size: 11px; line-height: 16px; }
  .text { overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; color: var(--hud-fg-3); }
  /* Hands-free lock: tells the user the mic stays open without the key. */
  .ico-lock { color: var(--hud-fg-2); }
  .ico-lock svg { width: 12px; height: 12px; }
  .ico-ok { color: var(--hud-ok); }
  .ico-warn { color: var(--hud-warn); }
  .ico-x { color: rgba(255, 255, 255, 0.5); }
  .ico svg { width: 15px; height: 15px; }
  .ico-ok, .ico-x { animation: pop 300ms cubic-bezier(0.2, 0.8, 0.2, 1); }

  /* Mock mode only: a quiet desktop so screenshots show the bar in place. */
  html.mock, html.mock body { background: linear-gradient(160deg, #c9ced6 0%, #aeb5c0 55%, #9aa2ae 100%) !important; }
  @media (prefers-color-scheme: dark) {
    html.mock, html.mock body { background: linear-gradient(160deg, #3a3f48 0%, #2a2e35 60%, #22252b 100%) !important; }
  }
  html.mock .fake-window {
    position: fixed; left: 50%; top: 40px; transform: translateX(-50%);
    width: min(560px, 80vw); height: calc(100vh - 170px);
    border-radius: 12px; background: rgba(255, 255, 255, 0.82);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    padding: 52px 40px; color: #3a3d44; font-size: 14px; line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) { html.mock .fake-window { background: rgba(40, 42, 47, 0.9); color: #c9ccd2; } }
  html.mock .fake-window .ln { height: 9px; border-radius: 5px; background: currentColor; opacity: 0.12; margin-bottom: 14px; }
  html.mock .stage { inset: auto; left: 50%; bottom: 8px; width: 300px; height: 72px; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="guides" id="guides" aria-hidden="true"></div>
  <div class="anchor" id="anchor">
  <div class="pill" id="pill" data-phase="hidden" role="status" aria-live="polite">
    <div class="content" id="content">
      <span class="ico ico-lock" id="lock" hidden><svg viewBox="0 0 12 12" fill="none"><rect x="2.2" y="5.2" width="7.6" height="5.6" rx="1.4" fill="currentColor"/><path d="M3.9 5.2V3.9a2.1 2.1 0 0 1 4.2 0v1.3" stroke="currentColor" stroke-width="1.3"/></svg></span>
      <span class="bars" id="bars" hidden></span>
      <span class="ico ico-ok" id="ok" hidden><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.3l2.1 2.1 4.3-4.6" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="ico ico-warn" id="warn" hidden><svg viewBox="0 0 16 16" fill="none"><path d="M8 1.8l6.6 11.6H1.4L8 1.8z" fill="currentColor"/><path d="M8 6.3v3.2" stroke="#111" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.4" r="0.9" fill="#111"/></svg></span>
      <span class="ico ico-x" id="x" hidden><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="#1a1a1d" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="hint" id="hint" hidden></span>
      <span class="text" id="text" hidden></span>
      <span class="tag" id="tag" hidden></span>
    </div>
  </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const N = 12;
  const IDLE_W = 46;

  const stage = document.getElementById("stage");
  const pill = document.getElementById("pill");
  const content = document.getElementById("content");
  const bars = document.getElementById("bars");
  const KEYS = ["lock", "ok", "warn", "x", "hint", "text", "tag"];
  const els = {};
  KEYS.forEach((k) => { els[k] = document.getElementById(k); });
  for (let i = 0; i < N; i++) bars.appendChild(document.createElement("i"));
  const barEls = Array.from(bars.children);

  // The pill may use the window width minus room for the shadow. If Python
  // makes the HUD window wider, long text gets more room automatically.
  // In free mode the window is the whole screen; the pill keeps its old cap.
  const maxW = () => Math.max(120, Math.min(stage.classList.contains("free") ? 332 : 1e9, stage.clientWidth - 28));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let phase = "hidden";
  let target = 0;   // last level from Python, 0..1
  let shown = 0;    // smoothed level
  let raf = 0;

  // ---------- bars ----------
  // Centre bars are taller than edge bars, so the shape reads as a voice and
  // not as a flat meter. At silence the bars breathe by up to 3 px, so the
  // bar never looks frozen (still dots read like a password field).
  const env = barEls.map((_, i) => 0.4 + 0.6 * Math.sin(Math.PI * (i + 0.5) / N));
  function frame(t) {
    raf = 0;
    if (phase === "listening") {
      // Fast attack, slow release: speech onsets show at once, gaps fade.
      const k = target > shown ? 0.55 : 0.18;
      shown += (target - shown) * k;
      const lv = Math.min(1, shown * 1.35);
      const prop = pill.classList.contains("v") ? "width" : "height";
      barEls.forEach((b, i) => {
        const breathe = 3 * (0.5 + 0.5 * Math.sin(t * 0.0035 + i * 0.55));
        const wob = 0.72 + 0.28 * Math.sin(t * 0.011 + i * 1.9);
        b.style[prop] = (4 + breathe + 14 * lv * env[i] * wob).toFixed(1) + "px";
      });
    } else if (phase === "transcribing") {
      // The bars settle into a low travelling wave: "working", no words.
      const prop = pill.classList.contains("v") ? "width" : "height";
      barEls.forEach((b, i) => {
        const w = 0.5 + 0.5 * Math.sin(t * 0.009 - i * 0.65);
        b.style[prop] = (4 + 6 * w).toFixed(1) + "px";
      });
    } else {
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  const loop = () => { if (!raf) raf = requestAnimationFrame(frame); };

  // ---------- text fitting ----------
  // Done text keeps its END visible ("…the last words"), so the user can
  // check how a long or Chinese sentence finished. Array.from keeps emoji
  // and other surrogate pairs whole.
  function fitHead(el, full, avail) {
    el.style.maxWidth = "none";
    el.textContent = full;
    if (el.scrollWidth <= avail) return;
    const chars = Array.from(full);
    let lo = 1, hi = chars.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      el.textContent = "…" + chars.slice(mid).join("");
      if (el.scrollWidth <= avail) hi = mid; else lo = mid + 1;
    }
    el.textContent = "…" + chars.slice(lo).join("");
  }

  // ---------- phases ----------
  function show(map) {
    bars.hidden = !map.bars;
    KEYS.forEach((k) => {
      const v = map[k];
      els[k].hidden = !v;
      if (k === "hint") els.hint.innerHTML = typeof v === "string" ? v : "";
      else if (typeof v === "string") els[k].textContent = v;
    });
  }

  let last = { phase: "hidden" };
  function apply(p) {
    last = p;
    const next = p && p.phase ? p.phase : "hidden";
    const changed = next !== phase;
    phase = next;
    const cap = maxW();

    // Upright on a side edge, unless the pill has text to show. Set this
    // before the text is measured: measured in the upright (column) layout,
    // the width comes out short and the end of the text is cut.
    const side = ["left", "right"].includes(stage.dataset.dock);
    const upright = side && ["idle", "hidden", "listening", "transcribing", "cancelled"].includes(next);
    if (upright !== pill.classList.contains("v")) {
      barEls.forEach((b) => { b.style.width = ""; b.style.height = ""; });
    }
    pill.classList.toggle("v", upright);

    if (next === "listening") {
      // Toggle mode shows how to stop and cancel. Hold mode needs no hint:
      // the user's finger is already on the key.
      const hint = p.mode === "toggle"
        ? (p.key ? `<span class="chip">${esc(p.key)}</span>to stop ·<span class="chip">esc</span>to cancel` : "Press again to stop")
        : "";
      // Hands-free (locked): a lock before the bars, same stop/cancel hint.
      show({ bars: true, hint, lock: !!p.locked });
      if (changed) { shown = 0; target = 0; }
    } else if (next === "transcribing") {
      show({ bars: true });
    } else if (next === "done") {
      const tag = p.output === "copy" ? "Copied" : p.output === "paste" ? "Pasted" : "";
      show({ ok: true, text: " ", tag });
      els.text.textContent = "";
      const avail = cap - Math.ceil(content.scrollWidth);
      fitHead(els.text, (p.text || "").replace(/\s+/g, " ").trim() || "Done", avail);
    } else if (next === "error") {
      show({ warn: true, text: " " });
      els.text.textContent = "";
      els.text.style.maxWidth = (cap - Math.ceil(content.scrollWidth)) + "px";
      els.text.textContent = p.message || "Something went wrong";
    } else if (next === "cancelled") {
      show({ x: true });
    } else {
      show({});
    }

    pill.classList.toggle("toggle", next === "listening" && p.mode === "toggle");
    pill.classList.toggle("locked", next === "listening" && !!p.locked);
    pill.dataset.phase = next;
    pill.setAttribute("aria-label", { listening: "Listening", transcribing: "Transcribing", done: "Done", cancelled: "Cancelled", error: p.message || "Error" }[next] || "");

    // Size the pill to its content so width can animate (auto cannot).
    if (upright) pill.style.width = "";
    else if (next === "idle" || next === "hidden") pill.style.width = IDLE_W + "px";
    else pill.style.width = Math.min(cap, Math.ceil(content.scrollWidth)) + "px";

    if (changed && next !== "idle" && next !== "hidden") {
      content.classList.remove("swap"); void content.offsetWidth; content.classList.add("swap");
    }
    if (next === "listening" || next === "transcribing") loop();
  }

  // ---------- free mode: dock, drag, guides (macOS) ----------
  const anchor = document.getElementById("anchor");
  const guides = document.getElementById("guides");
  const GAP = 4;                  // pill to screen edge, CSS px
  const MAGNETS = [1 / 3, 1 / 2, 2 / 3];
  const PULL = 48;                // a drop this close to a magnet lands on it
  const LINE = 160;               // length of the alignment line
  let area = null;                // usable insets {left, top, right, bottom}
  let place = { edge: "bottom", t: 0.5 };
  let drag = null;
  const api = (m, ...a) => {
    const p = window.pywebview && window.pywebview.api;
    return p && p[m] ? p[m](...a) : null;
  };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const flat = (edge) => edge === "bottom" || edge === "top";

  function box() {
    return { x: area.left, y: area.top, w: innerWidth - area.left - area.right, h: innerHeight - area.top - area.bottom };
  }
  function anchorFor(p) {
    const b = box();
    if (p.edge === "bottom") return [b.x + p.t * b.w, b.y + b.h - GAP];
    if (p.edge === "top") return [b.x + p.t * b.w, b.y + GAP];
    if (p.edge === "left") return [b.x + GAP, b.y + p.t * b.h];
    return [b.x + b.w - GAP, b.y + p.t * b.h];
  }
  function setAnchor(x, y, edge) {
    anchor.style.left = x + "px";
    anchor.style.top = y + "px";
    anchor.dataset.edge = edge;
  }
  function layout(animate) {
    anchor.classList.toggle("fly", !!animate);
    stage.dataset.dock = place.edge;
    const [x, y] = anchorFor(place);
    setAnchor(x, y, place.edge);
    apply(last);
    report();
  }

  // Where a pill centred at (px, py) would land: the nearest edge, then a
  // magnet on that edge if it is close enough.
  function targetAt(px, py) {
    const b = box();
    const fx = clamp((px - b.x) / b.w, 0, 1), fy = clamp((py - b.y) / b.h, 0, 1);
    const dist = { bottom: (1 - fy) * b.h, top: fy * b.h, left: fx * b.w, right: (1 - fx) * b.w };
    const edge = Object.keys(dist).reduce((a, k) => (dist[k] < dist[a] ? k : a));
    const len = flat(edge) ? b.w : b.h;
    let t = flat(edge) ? fx : fy;
    const near = MAGNETS.reduce((a, m) => (Math.abs(m - t) < Math.abs(a - t) ? m : a));
    const snapped = Math.abs(near - t) * len < PULL;
    if (snapped) t = near;
    t = clamp(t, 60 / len, 1 - 60 / len);
    return { edge, t, snapped, magnet: near };
  }

  function buildGuides() {
    const b = box();
    let html = "";
    const rail = (e, x, y, w, h) => `<i class="rail" data-e="${e}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`;
    html += rail("bottom", b.x + 8, b.y + b.h - 3, b.w - 16, 3) + rail("top", b.x + 8, b.y, b.w - 16, 3);
    html += rail("left", b.x, b.y + 8, 3, b.h - 16) + rail("right", b.x + b.w - 3, b.y + 8, 3, b.h - 16);
    for (const e of ["bottom", "top", "left", "right"]) {
      for (const m of MAGNETS) {
        const [x, y] = anchorFor({ edge: e, t: m });
        html += `<i class="tick" data-e="${e}" data-m="${m}" style="left:${x}px;top:${y}px"></i>`;
      }
    }
    html += `<i class="line" id="gline"></i><i class="ghost" id="ghost"></i>`;
    guides.innerHTML = html;
  }

  function showGuides(tg) {
    guides.querySelectorAll(".rail").forEach((r) => r.classList.toggle("on", r.dataset.e === tg.edge));
    guides.querySelectorAll(".tick").forEach((k) =>
      k.classList.toggle("on", tg.snapped && k.dataset.e === tg.edge && Number(k.dataset.m) === tg.magnet));
    const [x, y] = anchorFor(tg);
    const line = document.getElementById("gline");
    line.className = "line " + (flat(tg.edge) ? "v" : "h") + (tg.snapped ? " on" : "");
    if (tg.edge === "bottom") Object.assign(line.style, { left: x - 1 + "px", top: y - LINE + "px", height: LINE + "px", width: "" });
    if (tg.edge === "top") Object.assign(line.style, { left: x - 1 + "px", top: y + "px", height: LINE + "px", width: "" });
    if (tg.edge === "left") Object.assign(line.style, { left: x + "px", top: y - 1 + "px", width: LINE + "px", height: "" });
    if (tg.edge === "right") Object.assign(line.style, { left: x - LINE + "px", top: y - 1 + "px", width: LINE + "px", height: "" });
    // The ghost has the pill's size in the orientation of the target edge.
    const r = pill.getBoundingClientRect();
    const turn = flat(tg.edge) === pill.classList.contains("v");
    const w = turn ? r.height : r.width, h = turn ? r.width : r.height;
    const g = document.getElementById("ghost");
    const gx = tg.edge === "left" ? x : tg.edge === "right" ? x - w : x - w / 2;
    const gy = tg.edge === "top" ? y : tg.edge === "bottom" ? y - h : y - h / 2;
    Object.assign(g.style, { left: gx + "px", top: gy + "px", width: w + "px", height: h + "px" });
  }

  // While dragging, the pill already takes the orientation of the edge it
  // would land on, so the drop is only a move, not a move and a turn.
  function turnTo(edge) {
    if (stage.dataset.dock === edge) return;
    stage.dataset.dock = edge;
    apply(last);
  }

  // Tell Python where the pill is, for its hover hit test.
  let reportQueued = false;
  function report() {
    if (reportQueued) return;
    reportQueued = true;
    requestAnimationFrame(() => {
      reportQueued = false;
      const r = pill.getBoundingClientRect();
      api("pill_rect", [r.left, r.top, r.width, r.height]);
    });
  }
  new ResizeObserver(report).observe(pill);
  anchor.addEventListener("transitionend", report);

  pill.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (!area) {
      // Windows: the bar is a small window, and Python moves the window
      // itself while the button is down (winbar.py).
      if (window.pywebview && window.pywebview.api && window.pywebview.api.win_drag) {
        e.preventDefault();
        api("win_drag");
      }
      return;
    }
    e.preventDefault();
    pill.setPointerCapture(e.pointerId);
    const r = pill.getBoundingClientRect();
    drag = { sx: e.clientX, sy: e.clientY, dx: r.left + r.width / 2 - e.clientX, dy: r.top + r.height / 2 - e.clientY, moved: false };
  });
  pill.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 3) return;
      drag.moved = true;
      anchor.classList.remove("fly");
      pill.classList.add("dragging");
      buildGuides();
      guides.classList.add("on");
    }
    const cx = e.clientX + drag.dx, cy = e.clientY + drag.dy;
    setAnchor(cx, cy, "drag");
    drag.target = targetAt(cx, cy);
    turnTo(drag.target.edge);
    showGuides(drag.target);
  });
  function endDrag(e) {
    if (!drag) return;
    const d = drag;
    drag = null;
    try { pill.releasePointerCapture(e.pointerId); } catch (_) {}
    if (!d.moved) { api("clicked"); return; }
    // Drop the hover look now, inside the same animation as the landing;
    // left to Python's pointer poll it would shrink the pill a moment later.
    pill.classList.remove("dragging", "hover");
    guides.classList.remove("on");
    place = { edge: d.target.edge, t: Math.round(d.target.t * 10000) / 10000 };
    layout(true);
    api("save_place", place);
    api("drag_end");
  }
  pill.addEventListener("pointerup", endDrag);
  pill.addEventListener("pointercancel", endDrag);

  const preview = {};
  let external = false;
  window.hud = {
    set: (p) => { external = true; stopMock(); apply(p || {}); },
    level: (x) => { external = true; target = Math.max(0, Math.min(1, Number(x) || 0)); },
    dock: (edge) => { stage.dataset.dock = edge || "bottom"; apply(last); },
    hover: (on) => pill.classList.toggle("hover", !!on),
    drag: (on) => pill.classList.toggle("dragging", !!on),
    // The pill's box in window CSS px, for Python's hit test.
    rect: () => { const r = pill.getBoundingClientRect(); return JSON.stringify([r.left, r.top, r.width, r.height]); },
    // Free mode: the window covers the screen; insets mark the usable part.
    area: (insets) => {
      const first = !area;
      area = insets;
      stage.classList.add("free");
      layout(!first);
    },
    restore: (p) => {
      place = p && p.edge ? p : { edge: "bottom", t: 0.5 };
      if (area) layout(true);
    },
    // For screenshots and README recordings: act out a drag to (x, y),
    // then drop() as a release would.
    preview: (x, y) => {
      if (!guides.classList.contains("on")) { buildGuides(); guides.classList.add("on"); }
      anchor.classList.remove("fly");
      pill.classList.add("dragging"); setAnchor(x, y, "drag");
      preview.target = targetAt(x, y); turnTo(preview.target.edge); showGuides(preview.target);
    },
    // Act out a drag along points [[x, y], ...] over ms, at the display's
    // frame rate, then drop. For README recordings.
    rehearse: (points, ms) => new Promise((done) => {
      const t0 = performance.now();
      const step = (now) => {
        const u = Math.min(1, (now - t0) / ms);
        const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        const f = e * (points.length - 1), i = Math.min(points.length - 2, Math.floor(f)), k = f - i;
        window.hud.preview(points[i][0] + (points[i + 1][0] - points[i][0]) * k,
                           points[i][1] + (points[i + 1][1] - points[i][1]) * k);
        if (u < 1) requestAnimationFrame(step); else done();
      };
      requestAnimationFrame(step);
    }),
    drop: () => {
      pill.classList.remove("dragging", "hover"); guides.classList.remove("on");
      if (preview.target) { place = { edge: preview.target.edge, t: preview.target.t }; layout(true); }
    },
  };

  // ---------- mock (plain browser, or "?mock") ----------
  let mockTimer = 0;
  function stopMock() { if (mockTimer) { clearInterval(mockTimer); mockTimer = 0; } }
  function startMock() {
    document.documentElement.classList.add("mock");
    const fw = document.createElement("div");
    fw.className = "fake-window";
    fw.innerHTML = '<div class="ln" style="width:42%;opacity:.22;height:14px;margin-bottom:26px"></div>' +
      [92, 86, 95, 60, 0, 88, 79, 93, 40].map((w) => w ? `<div class="ln" style="width:${w}%"></div>` : '<div style="height:14px"></div>').join("");
    document.body.insertBefore(fw, document.body.firstChild);

    const key = "Right ⌥";
    const presets = {
      idle: { phase: "idle" },
      listening: { phase: "listening", mode: "hold", key },
      listening_silent: { phase: "listening", mode: "hold", key, silent: true },
      listening_toggle: { phase: "listening", mode: "toggle", key },
      hands_free: { phase: "listening", mode: "toggle", locked: true, key },
      transcribing: { phase: "transcribing", key },
      done: { phase: "done", output: "paste", key, text: "Let's move the review to Thursday afternoon, if that works for everyone." },
      done_copy: { phase: "done", output: "copy", key, text: "Remind me to send the invoice to Marta before Friday." },
      // CJK sample, escaped so the source stays ASCII: checks Chinese layout in the pill.
      done_long_zh: { phase: "done", output: "paste", key, text: "\u6211\u4eec\u628a\u8bc4\u5ba1\u4f1a\u6539\u5230\u5468\u56db\u4e0b\u5348\u5427\uff0c\u5982\u679c\u5927\u5bb6\u90fd\u65b9\u4fbf\u7684\u8bdd\uff0c\u6211\u660e\u5929\u4e0a\u5348\u628a\u8bae\u7a0b\u53d1\u51fa\u6765\u3002" },
      cancelled: { phase: "cancelled", key },
      error: { phase: "error", key, message: "Not logged in" },
      error_retry: { phase: "error", key, message: "Network error · Retry in menu" },
      hidden: { phase: "hidden" },
    };
    const load = () => {
      stopMock();
      const name = (location.hash || "#listening").slice(1);
      const p = presets[name] || presets.listening;
      // Start from idle so the expand is visible on load.
      apply({ phase: "idle" });
      setTimeout(() => apply(p), name === "idle" ? 0 : 250);
      if (p.phase === "listening" && !p.silent) {
        // Fake speech: syllable bursts with short pauses.
        let t = 0;
        mockTimer = setInterval(() => {
          t += 1;
          const syll = Math.max(0, Math.sin(t * 0.9)) * (0.5 + 0.5 * Math.sin(t * 0.13));
          const pause = (t % 46) > 38 ? 0.05 : 1;
          target = Math.min(1, (0.15 + 0.85 * syll) * pause * (0.75 + Math.random() * 0.25));
        }, 50);
      }
    };
    window.addEventListener("hashchange", load);
    load();
  }

  // "?mock" forces the mock, also inside pywebview, for screenshots.
  if (new URLSearchParams(location.search).has("mock")) startMock();
  else setTimeout(() => { if (!external && !window.pywebview) startMock(); }, 300);
})();
</script>
</body>
</html>
